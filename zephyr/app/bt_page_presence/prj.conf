# Anwesenheit per klassischem Bluetooth: das Board "pagt" die feste BT-Adresse des Handys (ACL-Verbindung
# ohne Kopplung), Erfolg = Handy in Reichweite und Bluetooth an. Keine App auf dem Handy noetig.
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

CONFIG_BT=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_DEVICE_NAME="AI-Eval-Kit"
CONFIG_BT_AIROC=y
CONFIG_CYW43439=y
CONFIG_BT_H4=y
CONFIG_AIROC_AUTOBAUD_MODE=n
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_INF=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_LOG_LEVEL_INF=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
