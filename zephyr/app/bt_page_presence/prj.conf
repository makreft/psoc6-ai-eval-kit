# Anwesenheit per klassischem Bluetooth-Paging im HCI-Rohmodus (ohne Host-Stack):
# Die Anwendung schickt Create Connection auf die feste BT-Adresse des Handys, wertet
# Connection Complete aus (0 = erreichbar, 0x04 = Page Timeout) und trennt sofort.
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
# Remote Name Request Complete ist 255 Bytes gross (248 Byte Name); Standardpuffer waere 70
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_BUF_ACL_TX_COUNT=2
CONFIG_BT_AIROC=y
CONFIG_CYW43439=y
CONFIG_BT_H4=y
CONFIG_AIROC_AUTOBAUD_MODE=n
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_INF=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
