# Gemeinsame Firmware: Bluetooth-Anwesenheit (HCI-Rohmodus, Paging) + Klatsch-Modell (Mikrofon, TFLM)
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
# Remote Name Request Complete ist 255 Bytes gross (248 Byte Name); Standardpuffer waere 70
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_BUF_ACL_TX_COUNT=2
CONFIG_BT_AIROC=y
CONFIG_CYW43439=y
CONFIG_BT_H4=y
CONFIG_AIROC_AUTOBAUD_MODE=n
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_INF=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Audio und Modell (aus clap_model)
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Hauptthread (Bluetooth) unter dem Audio-Thread (Prioritaet 5)
CONFIG_MAIN_THREAD_PRIORITY=7
