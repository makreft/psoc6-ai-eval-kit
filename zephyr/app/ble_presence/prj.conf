# Bluetooth-Anwesenheitserkennung auf dem CY8CKIT-062S2-AI (Zephyr)
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

# Bluetooth: nur beobachten (scannen), kein Advertising, keine Verbindungen
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="AI-Eval-Kit"
CONFIG_BT_AIROC=y
CONFIG_CYW43439=y
CONFIG_BT_H4=y
# CYW43439 kann kein Autobaud: Reset muss bei 115200 kommen, erst danach Umschalten auf die Download-Geschwindigkeit
CONFIG_AIROC_AUTOBAUD_MODE=n
# Treiber-Logs des HCI-Transports fuer den Bring-up
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_INF=y
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_LOG_LEVEL_WRN=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
